name: Website

# The project website (site/) on GitHub Pages. Deploys when the site, the media or a release changes.
on:
  push:
    branches: [dev, Release]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site (media from docs/media)
        run: |
          mkdir -p site/media
          cp -r docs/media/. site/media/
          # real pictures only: everything that is not a generated graphic (banner, cards, changelog cards)
          (cd site/media && find . -maxdepth 1 -type f \( -name '*.webp' -o -name '*.gif' -o -name '*.png' \) \
            ! -name 'banner.png' ! -name 'changelog-*' -printf '%f\n' | sort | jq -R . | jq -s .) > site/media/manifest.json
          cat site/media/manifest.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
