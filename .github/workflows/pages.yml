name: Website

# The PRODUCTION website (site/) on GitHub Pages.
#  - deploys from the `Release` branch only (push to Release, a published release, or a manual run)
#  - a push to `dev` never touches production
#  - manual run: pick a ref in "ref" (default Release). Deploying another ref replaces the live site
#    until the next Release deploy - only do that on purpose. There is no separate preview environment.
on:
  push:
    branches: [Release]
    paths:
      - 'site/**'
      - 'docs/media/**'
      - 'docs/development/handover/visual-acceptance-2026-10-08/**'
      - 'src/paused/cosmic-items/resources/resourcepacks/theprisons_items_standard/**'
      - 'CHANGELOG*.md'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to publish (default: Release = production)'
        required: false
        default: 'Release'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # push -> the pushed Release commit; release / manual -> the Release branch unless a ref was typed in
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || (github.event.inputs.ref || 'Release') }}

      - name: Assemble the site (verified textures and client captures)
        run: |
          mkdir -p site/media/textures site/media/screenshots
          cp docs/media/banner.png site/media/
          cp -R src/paused/cosmic-items/resources/resourcepacks/theprisons_items_standard/assets/theprisons/textures/item/prisons/. site/media/textures/
          qa=docs/development/handover/visual-acceptance-2026-10-08
          cp "$qa/config/0005_config_scale1_overview.png" site/media/screenshots/config-session.png
          cp "$qa/0004_market_1d_inventory_search.png" site/media/screenshots/item-list.png
          cp "$qa/0005_market_2_ah.png" site/media/screenshots/ah-overlay.png
          cp "$qa/0006_market_3_ee.png" site/media/screenshots/ee-overlay.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
