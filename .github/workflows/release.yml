name: Release

# Push a tag like v1.0.0 -> tests + build -> GitHub Release with the jar -> Discord.
# Discord: announcements are sent only by the official bot. Webhook secrets are deliberately not consumed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # only a yes/no flag: the token itself is passed to the one step that needs it
      HAS_BOT: ${{ secrets.DISCORD_BOT_TOKEN != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a SemVer tag (vX.Y.Z)"; exit 1
          fi
          prop="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [ "$prop" != "$version" ]; then
            echo "::error::mod_version in gradle.properties is '$prop' but the tag is '$tag'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          codename="$(sed -n 's/^release_codename=//p' gradle.properties)"
          mc="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "jar=ThePrisons-${codename}-v${version}-mc${mc}.jar" >> "$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew test build --no-daemon
          test -f "build/libs/${{ steps.version.outputs.jar }}"

      - name: Release notes from CHANGELOG.md
        run: |
          scripts/changelog-section.sh "${{ steps.version.outputs.version }}" > notes.md
          if ! [ -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section [${{ steps.version.outputs.version }}]"; exit 1
          fi
          # the German section (optional): appended to the release text and used for the second Discord embed
          scripts/changelog-section.sh "${{ steps.version.outputs.version }}" CHANGELOG.de.md > notes-de.md || true
          cp notes.md release-body.md
          if [ -s notes-de.md ]; then
            { echo; echo "---"; echo; echo "## 🇩🇪 Deutsch"; echo; sed 's/^### /#### /' notes-de.md; } >> release-body.md
          fi

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" \
            "build/libs/${{ steps.version.outputs.jar }}" \
            --title "ThePrisons v${{ steps.version.outputs.version }} · ${{ steps.version.outputs.codename }} · MC ${{ steps.version.outputs.mc }}" \
            --notes-file release-body.md \
            "${flags[@]}"

      - name: Discord (ThePrisons bot)
        # a tagged commit with "[no-discord]" in its message publishes the release without any Discord post
        if: ${{ !contains(github.event.head_commit.message, '[no-discord]') && env.HAS_BOT == 'true' }}
        continue-on-error: true
        working-directory: discord-bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_MENTIONS: ${{ vars.DISCORD_MENTIONS }}
          DISCORD_CHANNEL_WELCOME: ${{ vars.DISCORD_CHANNEL_WELCOME }}
          DISCORD_CHANNEL_RULES: ${{ vars.DISCORD_CHANNEL_RULES }}
          DISCORD_CHANNEL_GET_STARTED: ${{ vars.DISCORD_CHANNEL_GET_STARTED }}
          DISCORD_CHANNEL_FAQ: ${{ vars.DISCORD_CHANNEL_FAQ }}
          DISCORD_CHANNEL_ANNOUNCEMENTS: ${{ vars.DISCORD_CHANNEL_ANNOUNCEMENTS }}
          DISCORD_CHANNEL_CHANGELOG: ${{ vars.DISCORD_CHANNEL_CHANGELOG }}
          DISCORD_CHANNEL_ROADMAP: ${{ vars.DISCORD_CHANNEL_ROADMAP }}
          DISCORD_CHANNEL_KNOWN_ISSUES: ${{ vars.DISCORD_CHANNEL_KNOWN_ISSUES }}
        run: python3 -m prisonsbot release --version "${{ steps.version.outputs.version }}"

      - name: Discord unavailable (bot not configured)
        if: ${{ !contains(github.event.head_commit.message, '[no-discord]') && env.HAS_BOT != 'true' }}
        run: echo "Official Discord bot is not configured; no Discord message was sent. No webhook fallback is used."
