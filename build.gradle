
plugins {
    id 'fabric-loom' version '1.15.5'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

// The release asset, named so that every part can be read off: ThePrisons-<Codename>-v<SemVer>-mc<Minecraft>.jar
// e.g. ThePrisons-Nebula-v1.1.0-mc1.21.11.jar  (codename + mod_version in gradle.properties, Minecraft from minecraft_version)
def jarName = "${project.archives_base_name}-${project.release_codename}-v${project.version}-mc${project.minecraft_version}.jar"

tasks.named('jar', Jar) {
    archiveFileName = jarName
}

tasks.named('remapJar') {
    archiveFileName = jarName
}

// Explicit deployment only: a build never guesses a launcher directory. Supply the exact, existing `mods`
// directory after selecting the Prism instance, e.g.:
// ./gradlew installPrismMod -PtheprisonsInstallDir=/absolute/path/to/instance/minecraft/mods
tasks.register('installPrismMod', Copy) {
    group = 'distribution'
    description = 'Installs the remapped JAR into an explicitly supplied Prism/Minecraft mods directory.'
    dependsOn tasks.named('remapJar')

    def installDir = providers.gradleProperty('theprisonsInstallDir')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into(installDir.map { file(it) })

    doFirst {
        if (!installDir.present) {
            throw new GradleException('Refusing to install without -PtheprisonsInstallDir=/absolute/path/to/mods')
        }
        File destination = file(installDir.get()).canonicalFile
        if (!destination.isDirectory() || destination.name != 'mods') {
            throw new GradleException("Refusing to install: ${destination} is not an existing mods directory")
        }
        List<File> existing = destination.listFiles()?.findAll { file ->
            file.isFile() && file.name.toLowerCase(Locale.ROOT).contains('theprison') && file.name != jarName
        } ?: []
        if (!existing.isEmpty()) {
            throw new GradleException("Refusing to install beside other ThePrisons JAR(s): ${existing*.name.join(', ')}")
        }
    }
    doLast {
        File installed = file(installDir.get()).canonicalFile.toPath().resolve(jarName).toFile()
        if (!installed.isFile()) {
            throw new GradleException("Installation did not produce ${installed}")
        }
        logger.lifecycle("Installed verified artifact at ${installed}")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

repositories {
    mavenCentral()
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // Benchmarks write their numbers to build/benchmarks/. Console output (including the log lines of tests that
    // provoke errors on purpose) is only shown for tuning / trace runs: -Dtuning=...
    testLogging { showStandardStreams = System.getProperty('tuning') != null }
    systemProperty 'tuning', System.getProperty('tuning', 'false')
    systemProperty 'seed', System.getProperty('seed', '42')
    systemProperty 'legs', System.getProperty('legs', '4')
    // Writes the synthetic Cosmic fixtures (src/test/.../FixtureGenerator): ./gradlew test --tests '*FixtureGenerator' -Dcosmic.fixtures.write=true
    systemProperty 'cosmic.fixtures.write', System.getProperty('cosmic.fixtures.write', 'false')
}

// In-game integration tests (Fabric client gametest API): ./gradlew runClientGameTest
// Starts a real client, creates a test world, builds an ore cave and runs the Ore Macro (see src/gametest).
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "theprisons-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// The ore cave test rebuilds thousands of blocks at once (mine reset / another mine); the gametest API's network
// synchronizer does not cope with that and asks to be disabled for such tests.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
    jvmArgs '-Dfabric.client.gametest.disableNetworkSynchronizer=true'
    if (project.hasProperty('showcase')) {
        // tools/showcase.sh: the user build (no Ore Macro), only the showcase test, N seconds per scene
        jvmArgs '-Dtheprisons.showcase=true'
        if (project.hasProperty('showcaseClean')) {
            jvmArgs '-Dtheprisons.showcase.clean=true'
        }
        jvmArgs "-Dtheprisons.showcase.seconds=${project.findProperty('showcaseSeconds') ?: 4}"
    } else if (project.hasProperty('tunnel')) {
        // ./gradlew runClientGameTest -Ptunnel: the user build, only Tunnel Vision (screenshots)
        jvmArgs '-Dtheprisons.tunnel=true'
    } else if (project.hasProperty('config')) {
        // ./gradlew runClientGameTest -Pconfig: the user build, only the config GUI (completeness, entry points, screenshots)
        jvmArgs '-Dtheprisons.config=true'
    } else if (project.hasProperty('market')) {
        // ./gradlew runClientGameTest -Pmarket: the user build, only the market screens (screenshots)
        jvmArgs '-Dtheprisons.market=true'
    } else {
        // The Ore Macro exists only in the developer build (FeatureProfile.DEV).
        jvmArgs '-Dtheprisons.dev=true'
    }
}

// Pre-rewrite navigation / planning code kept in archive/ (never shipped). Compiled only to reproduce the
// "before" numbers: ./gradlew legacyBenchmark
sourceSets {
    legacyBenchmark {
        java {
            srcDir 'archive/pre-core-rewrite/src/main/java'
            srcDir 'archive/pre-core-rewrite/src/test/java'
            include 'io/theprisons/core/pathfinding/**'
            include 'io/theprisons/mining/ore/**'
            include 'io/theprisons/mining/LegacyBaselineBenchmarkTest.java'
            exclude 'io/theprisons/core/pathfinding/Pathfinder.java'
        }
        compileClasspath += sourceSets.test.compileClasspath
        runtimeClasspath += sourceSets.test.runtimeClasspath
    }
}

tasks.register('legacyBenchmark', Test) {
    description = 'Runs the benchmark of the archived pre-rewrite code (docs/core-rewrite/05-BENCHMARKS.md).'
    group = 'verification'
    testClassesDirs = sourceSets.legacyBenchmark.output.classesDirs
    classpath = sourceSets.legacyBenchmark.runtimeClasspath
    useJUnitPlatform()
    filter { includeTestsMatching '*LegacyBaselineBenchmarkTest' }
    testLogging { showStandardStreams = true }
}

// The paused Cosmic item look (docs/development/COSMIC_ITEM_PAUSE_PLAN.md): code, mixins, models, textures, the 35 standard
// textures, the comic filter and the tooltip look pack. Never part of the JAR (`build` does not touch it); kept compilable
// against the current main code: ./gradlew checkPausedCosmicItems
sourceSets {
    pausedCosmicItems {
        java { srcDir 'src/paused/cosmic-items/java' }
        resources { srcDirs = [] }
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    pausedCosmicItemsTest {
        java { srcDir 'src/paused/cosmic-items/test/java' }
        resources { srcDirs = [] }
        compileClasspath += sourceSets.test.compileClasspath + sourceSets.main.output + sourceSets.pausedCosmicItems.output
        runtimeClasspath += sourceSets.test.runtimeClasspath + sourceSets.main.output + sourceSets.pausedCosmicItems.output
    }
}

tasks.register('checkPausedCosmicItems', Test) {
    description = 'Compiles the paused Cosmic item look against the current code and runs its own tests (not part of build).'
    group = 'verification'
    testClassesDirs = sourceSets.pausedCosmicItemsTest.output.classesDirs
    classpath = sourceSets.pausedCosmicItemsTest.runtimeClasspath
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
